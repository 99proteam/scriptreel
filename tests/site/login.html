<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Log in · Lumen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="center-page">
    <form class="auth-card" id="login-form">
      <a class="logo" href="index.html"><span class="logo-mark"></span>Lumen</a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to your dashboard</p>
      <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" placeholder="you@company.com" autocomplete="off"></div>
      <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" placeholder="••••••••"></div>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="muted" style="text-align:center;margin:18px 0 0;font-size:14px">No account? <a href="signup.html" style="color:var(--accent);font-weight:600">Start a free trial</a></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const button = event.target.querySelector('button');
      button.innerHTML = '<span class="spinner"></span> Signing in…';
      setTimeout(() => { location.href = 'dashboard.html'; }, 600);
    });
  </script>
</body>
</html>
