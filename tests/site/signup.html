<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Start your free trial · Lumen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="index.html"><span class="logo-mark"></span>Lumen</a>
    <a class="btn btn-ghost" href="login.html">Log in</a>
  </nav>
  <main class="form-page" id="page">
    <h1>Start your free trial</h1>
    <p class="muted">14 days free. No credit card required.</p>
    <div class="card form-card">
      <form id="signup">
        <div class="row">
          <div class="field"><label for="name">Full name</label><input class="input" id="name" placeholder="Jane Cooper"></div>
          <div class="field"><label for="work-email">Work email</label><input class="input" id="work-email" type="email" placeholder="jane@company.com"></div>
        </div>
        <div class="row">
          <div class="field"><label for="company">Company</label><input class="input" id="company" placeholder="Acme Inc."></div>
          <div class="field"><label for="team-size">Team size</label>
            <select class="input" id="team-size">
              <option value="">Choose…</option>
              <option value="1-10">1–10 people</option>
              <option value="11-50">11–50 people</option>
              <option value="51-200">51–200 people</option>
              <option value="200+">200+ people</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Plan</label>
          <div class="choices">
            <label class="choice"><input type="radio" name="plan" value="starter"><strong>Starter</strong><span>Free forever</span></label>
            <label class="choice" id="plan-team"><input type="radio" name="plan" value="team" checked><strong>Team</strong><span>$49 / month</span></label>
            <label class="choice" id="plan-business"><input type="radio" name="plan" value="business"><strong>Business</strong><span>$199 / month</span></label>
          </div>
        </div>
        <div class="field"><label for="goals">What do you want to measure?</label><textarea class="input" id="goals" rows="3" placeholder="Revenue, activation, churn…"></textarea></div>
        <label class="check"><input type="checkbox" id="terms"> I agree to the terms of service</label>
        <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Create my account</button>
      </form>
      <div class="success" id="success"><div class="big">🎉</div><h2>You're in!</h2><p class="muted">Check your inbox to confirm your email.</p></div>
    </div>
  </main>
  <script>
    document.getElementById('signup').addEventListener('submit', (event) => {
      event.preventDefault();
      document.getElementById('page').classList.add('done');
    });
  </script>
</body>
</html>
